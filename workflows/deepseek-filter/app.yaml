          'y': 160
        width: 260
        height: 110
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          type: code
          title: 校验标题决定并提取通过项简介
          desc: ''
          selected: false
          code_language: javascript
          code: >-
            function readDecisions(text,ids){const
            data=JSON.parse(text);if(!Array.isArray(data.decisions)||data.decisions.length!==ids.length)throw
            Error('Incomplete decisions');const allowed=new Set(ids),seen=new Set();for(const d of
            data.decisions){if(!allowed.has(d.id)||seen.has(d.id)||typeof d.keep!=='boolean'||typeof
            d.reason!=='string'||!d.reason||d.reason.length>120||typeof
            d.confidence!=='number'||!Number.isFinite(d.confidence)||d.confidence<0||d.confidence>1)throw
            Error('Invalid decision');seen.add(d.id)}return data.decisions}

            function main({title_text,state}){const
            original=JSON.parse(state),decisions=readDecisions(title_text,original.ids).map(d=>({...d,keep:d.keep&&d.confidence>=0.65,screeningStage:'title'}));const
            kept=new Set(decisions.filter(d=>d.keep).map(d=>d.id));const
            candidates=original.batch.items.filter(x=>kept.has(x.id));return
            {description_input:JSON.stringify({context:original.batch.context||{},items:candidates.map(x=>({id:x.id,kind:x.kind,title:x.title,description:String(x.description||x.desc||'').slice(0,900),tags:x.tags||'',category:x.category||'',source:x.source,author:x.author,followers:x.followers??null,creatorVerified:x.creatorVerified===true,parts:x.parts||1,chapterTitles:(x.pages||[]).slice(0,12).map(p=>String(p.part||'').slice(0,100)),isCollection:x.isCollection===true,reserve:x.reserve||null,publishedAt:x.publishedAt||'',news:x.news===true}))}),state:JSON.stringify({...original,titleDecisions:decisions,candidateIds:candidates.map(x=>x.id)})}}
          variables:
            - variable: title_text
              value_selector:
                - '1003'
                - text
            - variable: state
              value_selector:
                - '1002'
                - state
          outputs:
            description_input:
              type: string
              children: null
            state:
              type: string
              children: null
      - id: '1006'
        type: custom
        position:
          x: 1280
          'y': 160
        positionAbsolute:
          x: 1280
          'y': 160
        width: 260
        height: 110
        sourcePosition: right
