              text: '{{#1004.description_input#}}'
      - id: '1007'
        type: custom
        position:
          x: 1590
          'y': 160
        positionAbsolute:
          x: 1590
          'y': 160
        width: 260
        height: 110
        sourcePosition: right
        targetPosition: left
        selected: false
        data:
          type: code
          title: 合并两轮决定，输出最终 JSON
          desc: ''
          selected: false
          code_language: javascript
          code: >-
            function readDecisions(text,ids){const
            data=JSON.parse(text);if(!Array.isArray(data.decisions)||data.decisions.length!==ids.length)throw
            Error('Incomplete decisions');const allowed=new Set(ids),seen=new Set();for(const d of
            data.decisions){if(!allowed.has(d.id)||seen.has(d.id)||typeof d.keep!=='boolean'||typeof
            d.reason!=='string'||!d.reason||d.reason.length>120||typeof
            d.confidence!=='number'||!Number.isFinite(d.confidence)||d.confidence<0||d.confidence>1)throw
            Error('Invalid decision');seen.add(d.id)}return data.decisions}

            function main({description_text,state}){const
            original=JSON.parse(state),second=readDecisions(description_text,original.candidateIds),decisions=new
            Map(original.titleDecisions.map(d=>[d.id,d]));for(const d of
            second)decisions.set(d.id,{...d,keep:d.keep&&d.confidence>=0.75,screeningStage:'description'});const
            audit=original.ids.map(id=>({...decisions.get(id),stage:'reviewed'})),kept=new
            Set(audit.filter(x=>x.keep).map(x=>x.id));const
            result=original.batch.schema?{...original.batch,stage:'reviewed',filterEngine:'workflow',items:original.batch.items.filter(x=>kept.has(x.id)),decisions:audit}:{version:'1',decisions:audit};return
            {result:JSON.stringify(result),audit:JSON.stringify(audit)}}
          variables:
