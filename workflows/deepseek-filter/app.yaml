app:
  description: workflow独立筛选：只筛标题 → 对通过项结合简介复筛 → 完整JSON。无默认规则节点。沿用SiliconFlow DeepSeek V4.1 Flash。
  icon: 🧠
  icon_background: '#14251A'
  icon_type: emoji
  mode: workflow
  name: UnBrainrot Workflow · 标题与简介两轮筛选
  use_icon_as_answer_icon: false
