<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="description" content="UnBrainrot 精选知识目录"><title>UnBrainrot</title><link rel="stylesheet" href="style.css"></head><body>
<a class="skip" href="#main">跳到内容</a><header class="header"><a class="brand" href="./" aria-label="UnBrainrot 首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 9v10a8 8 0 0 0 16 0V9M19 6h7v7M26 6l-9 9"/></svg><span>unbrainrot</span></a><nav aria-label="主导航"><button class="nav active" data-view="explore" aria-current="page">发现</button><button class="nav" data-view="saved">收藏 <b id="savedCount">0</b></button><button class="nav" data-view="history">足迹</button></nav><button id="focus" class="focus-button" title="20 分钟探索；关闭页面后不再提醒" aria-label="开始 20 分钟探索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span>20:00</span></button></header>
<main id="main"><h1 id="sectionTitle" class="sr">发现</h1><form id="searchForm" class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr" for="search">搜索精选目录</label><input id="search" type="search" placeholder="搜索感兴趣的内容" autocomplete="off"><kbd>/</kbd><button type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></form>
<section class="library" aria-label="内容目录"><div class="filters"><div class="topics" role="group" aria-label="主题筛选"></div><label class="sr" for="source">来源</label><select id="source"><option value="all">全部来源</option></select></div><p id="resultSummary" class="sr" aria-live="polite"></p><div id="cards" class="cards"></div><div id="empty" class="empty" hidden><p>暂无内容</p><button id="reset">重置筛选</button></div><div id="batchEnd" class="batch-end"><span class="end-line" aria-hidden="true"></span><button id="more">下一组 <span aria-hidden="true">↗</span></button></div></section><footer><span>精选目录 · 非全网搜索</span><button id="about" aria-label="关于内容与隐私">ⓘ</button></footer></main>
<dialog id="reflection"><form method="dialog"><h2>留下一个问题</h2><label class="sr" for="question">下次想探索的问题</label><textarea id="question" placeholder="下次，想弄懂什么？" maxlength="500"></textarea><div class="dialog-actions"><button value="cancel">跳过</button><button id="saveQuestion" value="save" class="primary">保存</button></div></form></dialog><dialog id="info"><form method="dialog"><h2>关于目录</h2><p>人工精选 12 项内容，搜索仅限此目录。封面为主题插画，非原站封面。</p><p>内容在原站打开，本站无法屏蔽原站推荐。收藏、足迹和问题仅保存在此浏览器。</p><button class="primary">关闭</button></form></dialog><div id="toast" role="status"></div><script src="app.js" defer></script></body></html>
