<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="description" content="UnBrainrot 精选知识目录"><title>UnBrainrot</title><link rel="stylesheet" href="style.css?v=4"></head><body>
<a class="skip" href="#main">跳到内容</a><header class="header"><a class="brand" href="./" aria-label="UnBrainrot 首页"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 9v10a8 8 0 0 0 16 0V9M19 6h7v7M26 6l-9 9"/></svg><span>unbrainrot</span></a><nav aria-label="主导航"><button class="nav active" data-view="explore" aria-current="page">发现</button><button class="nav" data-view="saved">收藏 <b id="savedCount">0</b></button><button class="nav" data-view="history">足迹</button></nav><button id="focus" class="focus-button" title="20 分钟探索；关闭页面后不再提醒" aria-label="开始 20 分钟探索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span>20:00</span></button></header>
<main id="main"><h1 id="sectionTitle" class="sr">发现</h1><form id="searchForm" class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr" for="search">搜索精选目录</label><input id="search" type="search" placeholder="搜索感兴趣的内容" autocomplete="off"><kbd>/</kbd><button type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></form>
<section class="library" aria-label="内容目录"><div class="filters"><div class="topics" role="group" aria-label="主题筛选"></div><div class="search-options"><label class="knowledge-toggle" title="按标题、标签和分区筛选；可能误判，不保证内容质量"><input id="knowledgeOnly" type="checkbox" checked>知识优先</label><label class="sr" for="searchMode">搜索范围</label><select id="searchMode"></select></div></div><p id="searchStatus" class="search-status" role="status"></p><p id="resultSummary" class="sr" aria-live="polite"></p><div id="cards" class="cards"></div><div id="empty" class="empty" hidden><p>暂无内容</p><button id="reset">重置筛选</button></div><div id="batchEnd" class="batch-end"><span class="end-line" aria-hidden="true"></span><button id="more">下一组 <span aria-hidden="true">↗</span></button></div></section><footer><span>B站知识目录</span><button id="about" aria-label="关于内容与隐私">ⓘ</button></footer></main>
<dialog id="reflection"><form method="dialog"><h2>留下一个问题</h2><label class="sr" for="question">下次想探索的问题</label><textarea id="question" placeholder="下次，想弄懂什么？" maxlength="500"></textarea><div class="dialog-actions"><button value="cancel">跳过</button><button id="saveQuestion" value="save" class="primary">保存</button></div></form></dialog><dialog id="info"><form method="dialog"><h2>关于目录</h2><p>展示 B站原标题、封面与简介。目录模式搜索已索引内容；实时模式由 Cloudflare Worker 搜索接口提供；受风控限制时显示错误并允许重试，不替换为目录结果。</p><p>知识优先根据标题、标签及分区筛选，可能误判，不保证真实性。B站播放器可能受登录、地区或视频权限限制。</p><p>最近更新：<span id="indexUpdated">加载中</span>。收藏、足迹和问题保存在此浏览器。</p><button class="primary">关闭</button></form></dialog><dialog id="viewer" class="viewer" aria-labelledby="viewerTitle"><header class="viewer-header"><div><h2 id="viewerTitle"></h2><p id="viewerAuthor"></p></div><button id="viewerClose" aria-label="关闭阅读面板">✕</button></header><div class="viewer-toolbar"><div role="tablist" aria-label="内容视图"><button id="watchTab" role="tab" aria-selected="true" aria-controls="watchPane">观看</button><button id="readTab" role="tab" aria-selected="false" aria-controls="readPane">简介</button></div><a id="originalLink" target="_blank" rel="noopener noreferrer">原视频 ↗</a></div><section id="watchPane" role="tabpanel" aria-labelledby="watchTab"><div id="playerFrame" class="player-frame"></div><p id="playerHint" class="player-hint">播放器加载中；若无法播放，可查看原视频。</p><label class="sr" for="parts">选择分集</label><select id="parts" aria-label="选择分集"></select></section><section id="readPane" class="reader" role="tabpanel" aria-labelledby="readTab" hidden><p class="reader-label">原视频简介</p><div id="videoDescription"></div></section></dialog><div id="toast" role="status"></div><script src="app.js?v=4" type="module"></script></body></html>
